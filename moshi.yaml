mitm:
  - hostname: "api.getmoshi.app"
    enabled: true

scriptings:
  - http_request:
      name: "Moshi Pro 解锁"
      match: "^https?://api\\.getmoshi\\.app/api/v1/(licenses|trials)"
      script_url: "https://raw.githubusercontent.com/EdwardRegal/moshi/refs/heads/main/moshi_pro.egern.js?token=GHSAT0AAAAAAEKJW66ZBB4E55V6IXXSO6XS2WEM5NA"
      update_interval: 86400
      timeout: 10
      body_required: false

  - http_response:
      name: "Moshi 配额解锁"
      match: "^https?://api\\.getmoshi\\.app/api/v1/(dictation|accounts)/usage$"
      script_url: "https://raw.githubusercontent.com/EdwardRegal/moshi/refs/heads/main/moshi_quota.egern.js?token=GHSAT0AAAAAAEKJW66YB7NTWWZ6DVUQZRLE2WEM4HQ"
      body_required: true          # ★ 读 ctx.response 必须开
      timeout: 10